project_id = "depthly-creator-outreach"

[auth]
site_url = "https://depthly.mouadrarhib.com"
additional_redirect_urls = ["https://depthly.mouadrarhib.com/discovery", "http://localhost:5173/discovery"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.youtube-creator-search]
verify_jwt = true
